<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>联系作者 · JSNU洗衣雷达</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #0ea5a4 0%, #14b8a6 55%, #2dd4bf 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #0f2e2c;
  }
  .card {
    width: 100%; max-width: 380px; background: #ffffff; border-radius: 22px;
    padding: 32px 26px 28px; text-align: center;
    box-shadow: 0 18px 50px rgba(0, 60, 55, .28);
  }
  .logo { font-size: 46px; line-height: 1; }
  h1 { font-size: 21px; margin-top: 12px; color: #0b3b39; letter-spacing: .5px; }
  .sub { font-size: 14px; color: #5b7a77; margin-top: 10px; line-height: 1.6; }
  .qq {
    margin: 18px auto 0; width: fit-content; font-size: 26px; font-weight: 700;
    letter-spacing: 1px; color: #0ea5a4; background: #e8faf8;
    padding: 8px 20px; border-radius: 12px;
  }
  .btn {
    display: block; width: 100%; margin-top: 22px; height: 50px; line-height: 50px;
    border-radius: 14px; font-size: 17px; font-weight: 600; text-decoration: none;
    border: none; cursor: pointer;
  }
  .btn.primary { background: linear-gradient(135deg, #0ea5a4, #14b8a6); color: #fff; }
  .btn.primary:active { opacity: .88; }
  .btn.ghost { background: #f1f6f5; color: #0b7a76; margin-top: 12px; }
  .btn.ghost:active { background: #e3eeed; }
  .tip { margin-top: 18px; font-size: 12.5px; color: #8aa5a2; line-height: 1.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🧺</div>
    <h1>JSNU 洗衣雷达</h1>
    <p class="sub">获取最新版本 / 反馈问题<br />请添加作者 QQ（小明同学）</p>
    <div class="qq">2284517861</div>

    <!-- href 直接是 QQ 资料卡协议（card_type=person：打开资料卡→可直接加好友，不走临时会话） -->
    <a class="btn primary"
       href="mqqapi://card/show_pslcard?src_type=internal&amp;version=1&amp;uin=2284517861&amp;card_type=person&amp;source=sharecard">
      ＋ 添加作者 QQ
    </a>
    <button class="btn ghost" id="copyBtn" type="button">复制 QQ 号</button>

    <p class="tip" id="tip">页面会尝试自动打开 QQ；若被浏览器拦截，请点上方按钮。<br />未安装 QQ 时请先安装手机 QQ。</p>
  </div>

<script>
  var QQ = "2284517861";
  // 资料卡（加好友）协议，按可靠性排序
  var SCHEMES = [
    "mqqapi://card/show_pslcard?src_type=internal&version=1&uin=" + QQ + "&card_type=person&source=sharecard",
    "mqqapi://card/show_pslcard?uin=" + QQ
  ];
  // 进入页面后自动尝试一次（部分手机浏览器会拦截自定义协议，拦截时用户可再点按钮）
  setTimeout(function () { window.location.href = SCHEMES[0]; }, 600);

  document.getElementById("copyBtn").addEventListener("click", function () {
    var btn = this;
    function ok() { btn.textContent = "已复制 ✓"; setTimeout(function () { btn.textContent = "复制 QQ 号"; }, 1500); }
    function fallback() { window.prompt("请手动复制 QQ 号", QQ); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(QQ).then(ok).catch(fallback);
    } else { fallback(); }
  });
</script>
</body>
</html>
